<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" fill="#f8f8f8"/>
  
  <!-- Snack Bag Shape -->
  <path d="M100 150 L300 150 L280 450 L120 450 Z" fill="#23b349"/>
  <path d="M100 150 L300 150 L280 450 L120 450 Z" fill="url(#companyGradient)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="companyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Bag Details -->
  <rect x="140" y="200" width="120" height="200" rx="10" fill="#ffffff" opacity="0.2"/>
  
  <!-- Logo Area -->
  <rect x="160" y="280" width="80" height="40" rx="5" fill="#ffffff" opacity="0.8"/>
  <text x="200" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#23b349">VITA</text>
  
  <!-- Product Name -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">PREMIUM</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#bbe7c7">SNACKS</text>
  
  <!-- Bag Opening -->
  <ellipse cx="200" cy="150" rx="100" ry="20" fill="#1a9a3c"/>
  <rect x="180" y="140" width="40" height="20" rx="5" fill="#ffffff" opacity="0.9"/>
</svg>
