<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fox Body -->
  <ellipse cx="60" cy="75" rx="35" ry="30" fill="#ff6b35"/>
  
  <!-- Fox Head -->
  <ellipse cx="60" cy="40" rx="28" ry="25" fill="#ff6b35"/>
  
  <!-- Ears -->
  <path d="M40 25 L35 10 L45 20 Z" fill="#ff6b35"/>
  <path d="M80 25 L85 10 L75 20 Z" fill="#ff6b35"/>
  <path d="M38 15 L42 18 L40 12 Z" fill="#333333"/>
  <path d="M82 15 L78 18 L80 12 Z" fill="#333333"/>
  
  <!-- Eyes -->
  <ellipse cx="48" cy="38" rx="4" ry="6" fill="#333333"/>
  <ellipse cx="72" cy="38" rx="4" ry="6" fill="#333333"/>
  <circle cx="49" cy="37" r="1.5" fill="white"/>
  <circle cx="73" cy="37" r="1.5" fill="white"/>
  
  <!-- Nose -->
