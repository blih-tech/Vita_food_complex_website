<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bear Body -->
  <ellipse cx="60" cy="75" rx="40" ry="35" fill="#8b4513"/>
  
  <!-- Bear Head -->
  <ellipse cx="60" cy="40" rx="30" ry="28" fill="#8b4513"/>
  
  <!-- Ears -->
  <circle cx="35" cy="25" r="12" fill="#8b4513"/>
  <circle cx="85" cy="25" r="12" fill="#8b4513"/>
  <circle cx="35" cy="25" r="6" fill="#d2691e"/>
  <circle cx="85" cy="25" r="6" fill="#d2691e"/>
  
  <!-- Eyes -->
  <circle cx="48" cy="38" r="5" fill="#333333"/>
  <circle cx="72" cy="38" r="5" fill="#333333"/>
  <circle cx="49" cy="37" r="2" fill="white"/>
  <circle cx="73" cy="37" r="2" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="60" cy="48" rx="6" ry="4" fill="#333333"/>
  
  <!-- Mouth -->
  <path d="M50 55 Q60 60 70 55" stroke="#333333" stroke-width="2" fill="none"/>
  
  <!-- Honey Pot -->
  <ellipse cx="90" cy="70" rx="15" ry="20" fill="#ffd700"/>
  <rect x="85" y="65" width="10" height="8" fill="#ffb347"/>
  <text x="90" y="72" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#8b4513">HONEY</text>
</svg>
