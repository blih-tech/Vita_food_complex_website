<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rabbit Body -->
  <ellipse cx="60" cy="70" rx="35" ry="40" fill="#f4e4c1"/>
  
  <!-- Rabbit Head -->
  <ellipse cx="60" cy="35" rx="25" ry="30" fill="#f4e4c1"/>
  
  <!-- Ears -->
  <ellipse cx="45" cy="15" rx="8" ry="20" fill="#f4e4c1" transform="rotate(-20 45 15)"/>
  <ellipse cx="75" cy="15" rx="8" ry="20" fill="#f4e4c1" transform="rotate(20 75 15)"/>
  
  <!-- Eyes -->
  <circle cx="50" cy="35" r="4" fill="#333333"/>
  <circle cx="70" cy="35" r="4" fill="#333333"/>
  <circle cx="51" cy="34" r="1" fill="white"/>
  <circle cx="71" cy="34" r="1" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="60" cy="42" rx="5" ry="3" fill="#ffb6c1"/>
  
  <!-- Mouth -->
  <path d="M55 48 Q60 52 65 48" stroke="#333333" stroke-width="2" fill="none"/>
  
  <!-- Tail -->
  <ellipse cx="85" cy="80" rx="12" ry="8" fill="#f4e4c1" transform="rotate(30 85 80)"/>
  
  <!-- Carrot -->
  <rect x="90" y="60" width="4" height="25" rx="2" fill="#ff6b35"/>
  <ellipse cx="92" cy="58" rx="6" ry="4" fill="#ffa500"/>
</svg>
