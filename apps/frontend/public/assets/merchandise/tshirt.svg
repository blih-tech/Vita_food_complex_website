<svg width="300" height="400" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="400" fill="#f0f0f0"/>
  
  <!-- T-Shirt Body -->
  <rect x="75" y="100" width="150" height="200" rx="5" fill="#ffffff"/>
  
  <!-- Neck -->
  <path d="M120 100 Q150 90 180 100 L180 120 L120 120 Z" fill="#ffffff"/>
  
  <!-- Logo -->
  <rect x="125" y="160" width="50" height="40" rx="5" fill="#23b349"/>
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">VITA</text>
  <text x="150" y="195" font-family="Arial, sans-serif" font-size="6" text-anchor="middle" fill="#bbe7c7">FOOD</text>
  
  <!-- Sleeves -->
  <rect x="50" y="120" width="30" height="100" rx="5" fill="#ffffff"/>
  <rect x="220" y="120" width="30" height="100" rx="5" fill="#ffffff"/>
  
  <!-- Bottom Hem -->
  <rect x="75" y="280" width="150" height="20" fill="#e0e0e0"/>
</svg>
